name: Validate HACS repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate HACS integration repository
        uses: hacs/action@main
        with:
          category: integration
