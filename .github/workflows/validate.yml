name: Validate integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q custom_components/klimat_domowy
      - name: Run pollen-state unit tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check custom_components/klimat_domowy/www/klimat-domowy-card.js
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("custom_components/klimat_domowy/manifest.json"),
              Path("hacs.json"),
              Path("custom_components/klimat_domowy/translations/pl.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK: {path}")
          PY
