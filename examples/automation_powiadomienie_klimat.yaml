alias: Klimat Domowy — inteligentne powiadomienie
description: >-
  Wysyła powiadomienie po utrzymaniu się nowego zalecenia przez 10 minut.
  Korzysta z tego samego zalecenia i atrybutów co karta dashboardu.
triggers:
  - trigger: state
    entity_id: sensor.klimat_domowy_zalecenie_wietrzenia
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.to_state is not none
         and trigger.from_state.state != trigger.to_state.state }}
actions:
  - delay: "00:10:00"
  - condition: template
    value_template: >-
      {{ states('sensor.klimat_domowy_zalecenie_wietrzenia')
         == trigger.to_state.state }}
  - action: notify.cala_rodzina
    data:
      title: "Klimat domu: {{ states('sensor.klimat_domowy_zalecenie_wietrzenia') }}"
      message: >-
        {{ state_attr('sensor.klimat_domowy_zalecenie_wietrzenia', 'reason')
           or 'Brak dodatkowego opisu — sprawdź kartę Klimat Domowy.' }}

        Wewnątrz: {{ state_attr('sensor.klimat_domowy_zalecenie_wietrzenia', 'indoor_temperature') | round(1) if state_attr('sensor.klimat_domowy_zalecenie_wietrzenia', 'indoor_temperature') is number else '—' }} °C,
        wilgotność {{ state_attr('sensor.klimat_domowy_zalecenie_wietrzenia', 'indoor_humidity') | round(0) if state_attr('sensor.klimat_domowy_zalecenie_wietrzenia', 'indoor_humidity') is number else '—' }}%.

        Na zewnątrz: {{ state_attr('sensor.klimat_domowy_zalecenie_wietrzenia', 'outdoor_temperature') | round(1) if state_attr('sensor.klimat_domowy_zalecenie_wietrzenia', 'outdoor_temperature') is number else '—' }} °C.
mode: restart
